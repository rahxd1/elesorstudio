      <stop offset="0%" stop-color="#1A1235"/>
      <stop offset="100%" stop-color="#2D154F"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bgPet)"/>
  <rect x="60" y="40" width="1480" height="80" rx="20" fill="#150B28" opacity="0.9"/>
