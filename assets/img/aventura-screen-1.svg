      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#243B55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#advWldBg)"/>
  <rect x="60" y="40" width="1480" height="80" rx="20" fill="#0B132B" opacity="0.9"/>
